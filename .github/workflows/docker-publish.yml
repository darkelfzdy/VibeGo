name: Build and Push Docker Image

on:
  push:
    branches:
      - docker # 仅当推送到 docker 分支时触发自动构建
  workflow_dispatch: # 允许你在网页上通过按钮手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 注意：将下面 mydockerhubuser 替换为你的实际 Docker Hub 用户名，或者直接使用变量
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vibego:24-trixie
